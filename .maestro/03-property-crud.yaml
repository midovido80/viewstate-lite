appId: com.viewstate.lite
---
- launchApp
- tapOn: "الرئيسية"
- tapOn: "إضافة عقار"
- tapOn:
    id: "property-title"
- inputText: "QA Salmiya Apartment"
- hideKeyboard
- tapOn:
    id: "property-area"
- inputText: "السالمية"
- hideKeyboard
- tapOn: "السالمية"
- tapOn:
    id: "property-block"
- assertVisible: "12"
- tapOn: "3"
- tapOn:
    id: "property-rent"
- inputText: "650"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "property-description"
    direction: DOWN
- tapOn:
    id: "property-description"
- inputText: "QA public property description"
- takeScreenshot: "property-description-keyboard"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "property-private-notes"
    direction: DOWN
- tapOn:
    id: "property-private-notes"
- inputText: "QA private notes must remain private"
- takeScreenshot: "property-private-notes-keyboard"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "اختر الموقع على Google Maps"
    direction: DOWN
- tapOn: "اختر الموقع على Google Maps"
- tapOn:
    id: "property-map-url"
- inputText: "https://maps.google.com/?q=29.3375,48.0750"
- takeScreenshot: "location-url-keyboard"
- hideKeyboard
- tapOn: "حفظ الموقع"
- scrollUntilVisible:
    element:
      text: "حفظ العقار"
    direction: DOWN
- tapOn: "حفظ العقار"
- assertVisible: "تفاصيل العقار"
- assertVisible: "QA Salmiya Apartment"
- tapOn: "تعديل العقار"
- tapOn:
    id: "property-title"
- eraseText: 40
- inputText: "QA Salmiya Apartment Edited"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "حفظ العقار"
    direction: DOWN
- tapOn: "حفظ العقار"
- assertVisible: "QA Salmiya Apartment Edited"

